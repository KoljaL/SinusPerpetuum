[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
# Generated by Copilot
extra_scripts = pre:scripts/load_env.py
lib_deps =
	ESP32Async/ESPAsyncWebServer
	ESP32Async/AsyncTCP
  
; Erzwingt einen sauberen Hardware-Reset beim Öffnen des Monitors
monitor_rts = 0
monitor_dtr = 0

; ÖFFNET DEN MONITOR AUTOMATISCH NACH DEM UPLOAD:
upload_targets = upload, monitor
