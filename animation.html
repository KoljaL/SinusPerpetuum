<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Präziser 2D Kugel-Simulator (Sinusbahn)</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f4f6f9;
        text-align: center;
        margin: 10px;
        color: #333;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }
      canvas {
        background: #fafafa;
        border: 1px solid #dfe4ec;
        border-radius: 6px;
        display: block;
        margin: 0 auto;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;

        text-align: left;
      }
      .control-group {
        display: flex;

      .stats {

      }

        grid-column: span 2;
        display: flex;
        gap: 10px;
        justify-content: center;

        border-radius: 4px;

        transition: background 0.2s;
      }
      #startBtn {
        background: #28a745;
        color: white;
      }
      #startBtn:hover {
        background: #218838;
      }
      #stopBtn {
        background: #dc3545;
        color: white;
      }
      #stopBtn:hover {
        background: #c82333;

        color: white;
      }
      #resetBtn:hover {
        background: #0069d9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Präziser 2D Kugel-Simulator (100cm Bahn)</h2>
      <canvas id="simCanvas" width="850" height="450"></canvas>

      <div class="stats">
        <span id="statX">Position: 0.0 cm</span>
        <span id="statV">Geschw.: 0.0 cm/s</span>
        <span id="statFr">Frequenz: 0.0 Hz</span>
      </div>

      <div class="controls">
        <div class="control-group">
          <label id="lblTilt">Bahn-Neigung: 0.0°</label>
          <input type="range" id="tilt" min="-10" max="10" step="0.5" value="0" />
        </div>
        <div class="control-group">
          <label id="lblAmp">Amplitude: 2.0 cm</label>
          <input type="range" id="amp" min="0" max="15" step="0.2" value="2" />
        </div>
        <div class="control-group">
          <label id="lblFreq">Anzahl der Wellenberge: 7</label>
          <input type="range" id="freq" min="2" max="12" step="1" value="7" />
        </div>
        <div class="control-group">
          <label id="lblSize">Kugel-Durchmesser: 4.8 cm</label>
          <input type="range" id="size" min="1" max="10" step="0.1" value="4.8" />
        </div>
        <div class="control-group">
          <label id="lblMass">Kugel-Gewicht: 450 g</label>
          <input type="range" id="mass" min="10" max="1000" step="10" value="450" />
        </div>
        <div class="control-group">
          <label id="lblRoll">Rollreibung (&mu;<sub>R</sub>): 0.0020 (Stahl/Eisen)</label>
          <input type="range" id="roll" min="0.0010" max="0.0030" step="0.0001" value="0.0020" />
        </div>
        <div class="control-group" style="grid-column: span 2">
          <label id="lblCw">Luftwiderstand (c<sub>w</sub>): 0.47 (Mittelwert Kugel)</label>
          <input type="range" id="cw" min="0.235" max="0.705" step="0.005" value="0.470" />
        </div>

        <div class="btn-container">
          <button id="startBtn">Start</button>
          <button id="stopBtn">Stop</button>
          <button id="resetBtn">Reset</button>
        </div>
      </div>
    </div>
    <script>
      const canvas = document.getElementById('simCanvas');
      const ctx = canvas.getContext('2d');

      // Physikalische Konstanten & Parameter
      const g = 981.0; // cm/s^2
      const rhoAir = 0.0012; // Luftdichte in g/cm^3
      const trackLengthCm = 100.0;
      const pixelsPerCm = canvas.width / trackLengthCm;

      let isRunning = false;

      // Standard-Vorgaben (inklusive neuer Spurweite)
      let tiltDeg = 0;
      let amplitudeCm = 2.0;
      let numPeaks = 7;
      let ballDiameterCm = 4.8;
      let radiusCm = ballDiameterCm / 2;
      let massG = 450;
      let muRoll = 0.002;
      let cwVal = 0.47;
      let trackGaugeCm = 3.5; // Reale 35mm Spurweite

      // Zustand der Kugel: s und v sind auf der Bahn tangentiale Größen.
      const muStatic = 0.004;
      const stictionSpeedEpsilon = 0.01;
      const fixedTimeStep = 1 / 240;
      let ballS = 0.0;
      let ballV = 0.0;
      let isOnTrack = true;
      let ballWorldX = 0.0;
      let ballWorldY = 0.0;
      let ballWorldVX = 0.0;
      let ballWorldVY = 0.0;
      let arcTable = [];
      let totalArcLength = 0.0;

      // UI-Elemente verknüpfen
      const tiltInput = document.getElementById('tilt');
      const ampInput = document.getElementById('amp');
      const freqInput = document.getElementById('freq');
      const sizeInput = document.getElementById('size');
      const massInput = document.getElementById('mass');
      const rollInput = document.getElementById('roll');
      const cwInput = document.getElementById('cw');

      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const resetBtn = document.getElementById('resetBtn');

      function loadSettings() {
        if (localStorage.getItem('tiltDeg') !== null) tiltDeg = parseFloat(localStorage.getItem('tiltDeg'));
        if (localStorage.getItem('amplitudeCm') !== null) amplitudeCm = parseFloat(localStorage.getItem('amplitudeCm'));
        if (localStorage.getItem('numPeaks') !== null) numPeaks = parseInt(localStorage.getItem('numPeaks'));
        if (localStorage.getItem('ballDiameterCm') !== null) ballDiameterCm = parseFloat(localStorage.getItem('ballDiameterCm'));
        if (localStorage.getItem('massG') !== null) massG = parseInt(localStorage.getItem('massG'));
        if (localStorage.getItem('muRoll') !== null) muRoll = parseFloat(localStorage.getItem('muRoll'));
        if (localStorage.getItem('cwVal') !== null) cwVal = parseFloat(localStorage.getItem('cwVal'));

        radiusCm = ballDiameterCm / 2;

        tiltInput.value = tiltDeg;
        ampInput.value = amplitudeCm;
        freqInput.value = numPeaks;
        sizeInput.value = ballDiameterCm;
        massInput.value = massG;
        rollInput.value = muRoll;
        cwInput.value = cwVal;
      }

      function saveSettings() {
        localStorage.setItem('tiltDeg', tiltDeg);
        localStorage.setItem('amplitudeCm', amplitudeCm);
        localStorage.setItem('numPeaks', numPeaks);
        localStorage.setItem('ballDiameterCm', ballDiameterCm);
        localStorage.setItem('massG', massG);
        localStorage.setItem('muRoll', muRoll);
        localStorage.setItem('cwVal', cwVal);
      }
      function updateLabels() {
        document.getElementById('lblTilt').innerText = `Bahn-Neigung: ${tiltDeg.toFixed(1)}°`;
        document.getElementById('lblAmp').innerText = `Amplitude: ${amplitudeCm.toFixed(1)} cm`;
        document.getElementById('lblFreq').innerText = `Anzahl der Wellenberge: ${numPeaks}`;
        document.getElementById('lblSize').innerText = `Kugel-Durchmesser: ${ballDiameterCm.toFixed(1)} cm`;
        document.getElementById('lblMass').innerText = `Kugel-Gewicht: ${massG} g`;
        document.getElementById('lblRoll').innerText = `Rollreibung (μR): ${muRoll.toFixed(4)}`;
        document.getElementById('lblCw').innerText = `Luftwiderstand (cw): ${cwVal.toFixed(3)}`;
      }

      // Berechnet den effektiven Rollradius basierend auf Spurweite und Außenradius
      function getEffRadius() {
        let halfGauge = trackGaugeCm / 2;
        if (radiusCm > halfGauge) {
          return Math.sqrt(radiusCm * radiusCm - halfGauge * halfGauge);
        }
        return radiusCm; // Fallback, falls Kugel zu klein für die Spur wäre
      }

      // Berechnet den modifizierten Beschleunigungsfaktor für die Schienen-Zwei-Punkt-Auflage
      function getAccelerationFactor() {
        let rEff = getEffRadius();
        let ratio = radiusCm / rEff;
        return 1.0 / (1.0 + 0.4 * ratio * ratio);
      }

      function getWaveNumber() {
        return ((numPeaks - 1) * Math.PI) / trackLengthCm;
      }

      function getBaseY(x) {
        return amplitudeCm * Math.cos(getWaveNumber() * x);
      }

      function getBaseSlope(x) {
        return -amplitudeCm * getWaveNumber() * Math.sin(getWaveNumber() * x);
      }

      function getBaseCurvature(x) {
        const k = getWaveNumber();
        const firstDerivative = getBaseSlope(x);
        const secondDerivative = -amplitudeCm * k * k * Math.cos(k * x);
        return secondDerivative / Math.pow(1 + firstDerivative * firstDerivative, 1.5);
      }

      function rebuildArcTable() {
        const sampleCount = 1200;
        arcTable = [{ x: 0, s: 0 }];
        totalArcLength = 0;

        let previousX = 0;
        let previousScale = Math.sqrt(1 + getBaseSlope(previousX) ** 2);
        for (let index = 1; index <= sampleCount; index += 1) {
          const x = (trackLengthCm * index) / sampleCount;
          const scale = Math.sqrt(1 + getBaseSlope(x) ** 2);
          totalArcLength += ((scale + previousScale) * (x - previousX)) / 2;
          arcTable.push({ x, s: totalArcLength });
          previousX = x;
          previousScale = scale;
        }
      }

      function xToS(x) {
        if (x <= 0) return 0;
        if (x >= trackLengthCm) return totalArcLength;

        let low = 0;
        let high = arcTable.length - 1;
        while (low + 1 < high) {
          const middle = Math.floor((low + high) / 2);
          if (arcTable[middle].x < x) low = middle;
          else high = middle;
        }

        const left = arcTable[low];
        const right = arcTable[high];
        const fraction = (x - left.x) / (right.x - left.x);
        return left.s + fraction * (right.s - left.s);
      }

      function sToX(s) {
        if (s <= 0) return 0;
        if (s >= totalArcLength) return trackLengthCm;

        let low = 0;
        let high = arcTable.length - 1;
        while (low + 1 < high) {
          const middle = Math.floor((low + high) / 2);
          if (arcTable[middle].s < s) low = middle;
          else high = middle;
        }

        const left = arcTable[low];
        const right = arcTable[high];
        const fraction = (s - left.s) / (right.s - left.s);
        return left.x + fraction * (right.x - left.x);
      }

      function getTrackPosition() {
        const x = sToX(ballS);
        const baseSlope = getBaseSlope(x);
        const alphaBase = Math.atan(baseSlope);
        const tiltRad = (tiltDeg * Math.PI) / 180;
        const alpha = alphaBase + tiltRad;
        const rEff = getEffRadius();
        const baseNormalX = -Math.sin(alphaBase);
        const baseNormalY = Math.cos(alphaBase);
        const baseCenterX = x + rEff * baseNormalX;
        const baseCenterY = getBaseY(x) + rEff * baseNormalY;
        const rotatedCenter = rotatePoint(baseCenterX, baseCenterY, tiltRad);

        return {
          x,
          alpha,
          curvature: getBaseCurvature(x),
          worldX: rotatedCenter.x,
          worldY: rotatedCenter.y,
          tangentX: Math.cos(alpha),
          tangentY: Math.sin(alpha),
        };
      }

      function getNormalForce(trackPosition) {
        const curvatureRadius = trackPosition.curvature === 0 ? Infinity : 1 / trackPosition.curvature;
        return massG * g * Math.cos(trackPosition.alpha) + (massG * ballV * ballV) / curvatureRadius;
      }

      function detachFromTrack() {
        const trackPosition = getTrackPosition();
        isOnTrack = false;
        ballWorldX = trackPosition.worldX;
        ballWorldY = trackPosition.worldY;
        ballWorldVX = ballV * trackPosition.tangentX;
        ballWorldVY = ballV * trackPosition.tangentY;
      }

      function getTrackXBounds() {
        return {
          min: radiusCm,
          max: trackLengthCm - radiusCm,
        };
      }

      function resetSimulation() {
        rebuildArcTable();
        const bounds = getTrackXBounds();
        ballS = xToS(Math.max(0, Math.min(trackLengthCm, bounds.min)));
        ballV = 0.0;
        isOnTrack = true;
        const trackPosition = getTrackPosition();
        ballWorldX = trackPosition.worldX;
        ballWorldY = trackPosition.worldY;
        ballWorldVX = 0.0;
        ballWorldVY = 0.0;
        timeAccumulator = 0;
      }

      tiltInput.addEventListener('input', (e) => {
        tiltDeg = parseFloat(e.target.value);
        updateLabels();
        saveSettings();
      });
      ampInput.addEventListener('input', (e) => {
        const previousX = isOnTrack ? sToX(ballS) : null;
        amplitudeCm = parseFloat(e.target.value);
        rebuildArcTable();
        if (isOnTrack && previousX !== null) ballS = xToS(previousX);
        updateLabels();
        saveSettings();
      });
      freqInput.addEventListener('input', (e) => {
        const previousX = isOnTrack ? sToX(ballS) : null;
        numPeaks = parseInt(e.target.value);
        rebuildArcTable();
        if (isOnTrack && previousX !== null) ballS = xToS(previousX);
        updateLabels();
        saveSettings();
      });
      sizeInput.addEventListener('input', (e) => {
        ballDiameterCm = parseFloat(e.target.value);
        radiusCm = ballDiameterCm / 2;
        updateLabels();
        saveSettings();
        if (!isRunning) resetSimulation();
      });
      massInput.addEventListener('input', (e) => {
        massG = parseInt(e.target.value);
        updateLabels();
        saveSettings();
      });
      rollInput.addEventListener('input', (e) => {
        muRoll = parseFloat(e.target.value);
        updateLabels();
        saveSettings();
      });
      cwInput.addEventListener('input', (e) => {
        cwVal = parseFloat(e.target.value);
        updateLabels();
        saveSettings();
      });

      startBtn.addEventListener('click', () => {
        isRunning = true;
      });
      stopBtn.addEventListener('click', () => {
        isRunning = false;
      });
      resetBtn.addEventListener('click', () => {
        isRunning = false;
        resetSimulation();
      });

      function rotatePoint(x, y, angleRad) {
        let cx = trackLengthCm / 2;
        let cy = 0;
        return {
          x: cx + (x - cx) * Math.cos(angleRad) - (y - cy) * Math.sin(angleRad),
          y: cy + (x - cx) * Math.sin(angleRad) + (y - cy) * Math.cos(angleRad),
        };
      }

      function toPixel(worldX, worldY) {
        return { x: worldX * pixelsPerCm, y: 225 - worldY * pixelsPerCm };
      }
      let lastTime = performance.now();
      let timeAccumulator = 0;

      function advanceOnTrack(dt) {
        const trackPosition = getTrackPosition();
        const normalForce = getNormalForce(trackPosition);

        // Bei negativer Normalkraft verliert die Kugel den Schienenkontakt.
        if (!Number.isFinite(normalForce) || normalForce <= 0) {
          detachFromTrack();
          return;
        }

        const gravityForce = -massG * g * Math.sin(trackPosition.alpha);
        if (Math.abs(ballV) <= stictionSpeedEpsilon && Math.abs(gravityForce) <= muStatic * normalForce) {
          ballV = 0;
          return;
        }

        const rollingForce = ballV === 0 ? 0 : -Math.sign(ballV) * muRoll * normalForce;
        const crossSectionArea = Math.PI * radiusCm * radiusCm;
        const airForce = -0.5 * rhoAir * crossSectionArea * cwVal * ballV * Math.abs(ballV);
        const totalTangentialForce = gravityForce + rollingForce + airForce;
        const acceleration = getAccelerationFactor() * (totalTangentialForce / massG);
        const previousVelocity = ballV;

        // Euler-Cromer: zuerst v, danach die Bahnbogenlänge s integrieren.
        ballV += acceleration * dt;
        ballS += ballV * dt;

        const bounds = getTrackXBounds();
        const currentX = sToX(ballS);
        if (currentX < bounds.min || currentX > bounds.max) {
          ballS = xToS(Math.max(bounds.min, Math.min(bounds.max, currentX)));
          detachFromTrack();
          return;
        }

        const postPosition = getTrackPosition();
        const postNormalForce = getNormalForce(postPosition);
        const postGravityForce = -massG * g * Math.sin(postPosition.alpha);
        const crossedZero = previousVelocity !== 0 && previousVelocity * ballV < 0;
        const isNearlyStationary = Math.abs(ballV) <= stictionSpeedEpsilon;
        if ((isNearlyStationary || crossedZero) && Math.abs(postGravityForce) <= muStatic * postNormalForce) {
          ballV = 0;
        }
      }

      function advanceFreeFlight(dt) {
        ballWorldVY -= g * dt;
        ballWorldX += ballWorldVX * dt;
        ballWorldY += ballWorldVY * dt;
      }

      function advanceSimulation(dt) {
        if (isOnTrack) advanceOnTrack(dt);
        else advanceFreeFlight(dt);
      }

      function simulationStep(now) {
        const frameTime = Math.min(Math.max((now - lastTime) / 1000, 0), 0.1);
        lastTime = now;

        if (isRunning) {
          timeAccumulator += frameTime;
          let stepCount = 0;
          while (timeAccumulator >= fixedTimeStep && stepCount < 24) {
            advanceSimulation(fixedTimeStep);
            timeAccumulator -= fixedTimeStep;
            stepCount += 1;
          }
          if (stepCount === 24) timeAccumulator = 0;
        }

        const tiltRad = (tiltDeg * Math.PI) / 180;
        const trackPosition = isOnTrack ? getTrackPosition() : null;
        const displayX = isOnTrack ? trackPosition.x : ballWorldX;
        const displaySpeed = isOnTrack ? Math.abs(ballV) : Math.hypot(ballWorldVX, ballWorldVY);
        const wavelength = (2 * totalArcLength) / (numPeaks - 1);
        document.getElementById('statX').innerText = `Position: ${displayX.toFixed(1)} cm${isOnTrack ? '' : ' (frei)'}`;
        document.getElementById('statV').innerText = `Geschw.: ${displaySpeed.toFixed(1)} cm/s`;
        document.getElementById('statFr').innerText = `Frequenz: ${(displaySpeed / wavelength).toFixed(2)} Hz`;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#e9ecef';
        ctx.lineWidth = 1;
        for (let i = 10; i < 100; i += 10) {
          const pStart = toPixel(i, -20);
          const pEnd = toPixel(i, 20);
          ctx.beginPath();
          ctx.moveTo(pStart.x, pStart.y);
          ctx.lineTo(pEnd.x, pEnd.y);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.strokeStyle = '#4a5568';
        ctx.lineWidth = 5;
        for (let x = 0; x <= trackLengthCm; x += 0.5) {
          const rotatedPoint = rotatePoint(x, getBaseY(x), tiltRad);
          const pixelPoint = toPixel(rotatedPoint.x, rotatedPoint.y);
          if (x === 0) ctx.moveTo(pixelPoint.x, pixelPoint.y);
          else ctx.lineTo(pixelPoint.x, pixelPoint.y);
        }
        ctx.stroke();

        const ballCenter = isOnTrack ? { x: trackPosition.worldX, y: trackPosition.worldY } : { x: ballWorldX, y: ballWorldY };
        const ballPixel = toPixel(ballCenter.x, ballCenter.y);
        const radiusPixel = radiusCm * pixelsPerCm;

        ctx.beginPath();
        ctx.arc(ballPixel.x, ballPixel.y, radiusPixel, 0, Math.PI * 2);
        ctx.fillStyle = '#ff6b6b';
        ctx.fill();
        ctx.strokeStyle = '#fa5252';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(ballPixel.x, ballPixel.y);
        const rollRadius = getEffRadius();
        const rollAngle = -(ballS / rollRadius) + tiltRad;
        ctx.lineTo(ballPixel.x + radiusPixel * Math.cos(rollAngle), ballPixel.y - radiusPixel * Math.sin(rollAngle));
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        requestAnimationFrame(simulationStep);
      }

      loadSettings();
      updateLabels();
      resetSimulation();
      requestAnimationFrame(simulationStep);
    </script>
  </body>
</html>
