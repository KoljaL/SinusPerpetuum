<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%"
  style="background-color: #ffffff; font-family: 'Segoe UI', Helvetica, Arial, sans-serif;">
  <!-- Diagramm-Bereich -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3748">Widerstandsverlauf
    Kupferdraht (0 - 150 °C)</text>
  <text x="400" y="60" text-anchor="middle" font-size="12" fill="#718096">Draht: d = 0,5 mm | Länge
    = 50 m</text>

  <!-- Achsen & Gitterlinien -->
  <line x1="100" y1="350" x2="700" y2="350" stroke="#a0aec0" stroke-width="2" />
  <line x1="100" y1="100" x2="100" y2="350" stroke="#a0aec0" stroke-width="2" />

  <line x1="100" y1="264" x2="700" y2="264" stroke="#e2e8f0" stroke-dasharray="4" />
  <line x1="100" y1="178" x2="700" y2="178" stroke="#e2e8f0" stroke-dasharray="4" />
  <line x1="100" y1="92" x2="700" y2="92" stroke="#e2e8f0" stroke-dasharray="4" />

  <!-- Achsenbeschriftung -->
  <text x="400" y="390" text-anchor="middle" font-size="14" font-weight="600" fill="#4a5568">Temperatur
    T (°C)</text>
  <text x="40" y="225" text-anchor="middle" font-size="14" font-weight="600" fill="#4a5568"
    transform="rotate(-90 40 225)">Widerstand R (Ω)</text>

  <!-- X-Achse Ticks -->
  <text x="100" y="370" text-anchor="middle" font-size="12" fill="#4a5568">0°C</text>
  <text x="180" y="370" text-anchor="middle" font-size="12" fill="#4a5568">20°C</text>
  <text x="340" y="370" text-anchor="middle" font-size="12" fill="#4a5568">60°C</text>
  <text x="460" y="370" text-anchor="middle" font-size="12" fill="#4a5568">90°C</text>
  <text x="580" y="370" text-anchor="middle" font-size="12" fill="#4a5568">120°C</text>
  <text x="700" y="370" text-anchor="middle" font-size="12" fill="#4a5568">150°C</text>

  <!-- Y-Achse Ticks -->
  <text x="90" y="354" text-anchor="end" font-size="12" fill="#4a5568">4,0 Ω</text>
  <text x="90" y="268" text-anchor="end" font-size="12" fill="#4a5568">5,0 Ω</text>
  <text x="90" y="182" text-anchor="end" font-size="12" fill="#4a5568">6,0 Ω</text>
  <text x="90" y="96" text-anchor="end" font-size="12" fill="#4a5568">7,0 Ω</text>

  <!-- Datenlinie & Punkte -->
  <line x1="100" y1="334.5" x2="700" y2="105" stroke="#dd6b20" stroke-width="3" />

  <!-- 0°C -->
  <circle cx="100" cy="334.5" r="4" fill="#dd6b20" />
  <text x="105" y="325" font-size="11" font-weight="bold" fill="#dd6b20">4,18 Ω</text>

  <!-- 20°C -->
  <circle cx="180" cy="304.2" r="4" fill="#3182ce" />
  <text x="185" y="295" font-size="11" font-weight="bold" fill="#3182ce">4,53 Ω (20°C)</text>

  <!-- 150°C -->
  <circle cx="700" cy="105" r="4" fill="#dd6b20" />
  <text x="690" y="95" text-anchor="end" font-size="11" font-weight="bold" fill="#dd6b20">6,85 Ω</text>

  <!-- Formel- und Infobereich unter dem Plot -->
  <rect x="60" y="420" width="680" height="200" rx="8" fill="#f7fafc" stroke="#e2e8f0"
    stroke-width="1.5" />

  <!-- Spalte 1: Formeln -->
  <text x="90" y="455" font-size="16" font-weight="bold" fill="#2d3748">Formeln</text>
  <text x="90" y="490" font-size="14" font-family="Courier New, monospace" font-weight="bold"
    fill="#2b6cb0">R20 = ρ • (l / A)</text>
  <text x="90" y="515" font-size="12" fill="#4a5568">Kaltwiderstand bei 20 °C Bezugstemperatur</text>

  <text x="90" y="565" font-size="14" font-family="Courier New, monospace" font-weight="bold"
    fill="#2b6cb0">R(T) = R20 • [1 + α • (T - 20 °C)]</text>
  <text x="90" y="590" font-size="12" fill="#4a5568">Temperaturabhängiger Widerstand bei
    Zieltemperatur T</text>

  <!-- Spalte 2: Konstanten & Werte -->
  <text x="460" y="455" font-size="16" font-weight="bold" fill="#2d3748">Gegebene Werte &amp;
    Konstanten</text>

  <text x="460" y="485" font-size="13" fill="#4a5568"><tspan font-weight="bold">Spezifischer
    Widerstand (ρ):</tspan> 0,0178 (Ω • mm²) / m</text>
  <text x="460" y="510" font-size="13" fill="#4a5568"><tspan font-weight="bold">Temperaturkoeffizient
    (α):</tspan> 0,00393 K⁻¹ (bei 20 °C)</text>
  <text x="460" y="535" font-size="13" fill="#4a5568"><tspan font-weight="bold">Leiterlänge (l):</tspan>
    50 m</text>
  <text x="460" y="560" font-size="13" fill="#4a5568"><tspan font-weight="bold">Drahtdurchmesser
      (d):</tspan> 0,5 mm</text>
  <text x="460" y="585" font-size="13" fill="#4a5568"><tspan font-weight="bold">Querschnittsfläche
    (A):</tspan> 0,1963 mm²</text>
</svg>